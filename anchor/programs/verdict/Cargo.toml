[package]
name = "verdict"
version = "0.1.0"
description = "Verdict — arbitration & dispute resolution for AI-agent commerce on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "verdict"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.30.1"
anchor-spl = { version = "=0.30.1", default-features = false, features = ["token", "associated_token"] }
# Transitive pins: Agave 2.3.13 ships platform-tools v1.48 with cargo 1.84.0,
# which is one minor before edition2024 stabilization (1.85). These pin the
# blast-radius transitive deps to their last pre-edition2024 releases so the
# resolver doesn't need to parse newer manifests during `cargo metadata`.
blake3 = "=1.8.3"
proc-macro-crate = "=3.3.0"
toml_edit = "=0.22.27"
