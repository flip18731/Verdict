[package]
name = "verdict"
version = "0.1.0"
description = "Verdict — arbitration & dispute resolution for AI-agent commerce on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "verdict"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.30.1"
anchor-spl = { version = "=0.30.1", default-features = false, features = ["token", "associated_token"] }
# anchor-syn 0.30.1's IDL build calls `proc_macro2::Span::source_file()`,
# which was removed in proc-macro2 1.0.95. Pin to the last release that
# still exposes it.
proc-macro2 = "=1.0.92"
