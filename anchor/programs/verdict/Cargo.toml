[package]
name = "verdict"
version = "0.1.0"
description = "Verdict — arbitration & dispute resolution for AI-agent commerce on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "verdict"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "associated_token"] }
