[package]
name = "verdict"
version = "0.1.0"
description = "Verdict — arbitration & dispute resolution for AI-agent commerce on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "verdict"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# Anchor's #[program] macro emits cfg(feature = "...") checks against these
# names. Declaring them as empty no-op features is the canonical Anchor pattern
# for keeping `unexpected_cfgs` warnings out of an otherwise-clean build.
anchor-debug = []
custom-heap = []
custom-panic = []
# anchor-spl 0.31.1's idl_build.rs has unconditional `crate::token_interface::*`
# references but the token_interface module is gated behind the `token_2022`
# feature. Pull token_2022 in only on the IDL build path so runtime CPI keeps
# using the classic SPL Token program (the spec's choice).
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022", "anchor-spl/token_2022_extensions"]

[lints.rust]
# anchor-lang's runtime emits cfg(target_os = "solana") checks; the host build
# (cargo metadata, IDL extraction) doesn't have that target and otherwise warns
# on every macro-expansion site. Whitelist the value rather than blanket-allow.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "associated_token"] }
