[package]
name = "verdict"
version = "0.1.0"
description = "Verdict — arbitration & dispute resolution for AI-agent commerce on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "verdict"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.30.1"
anchor-spl = { version = "=0.30.1", default-features = false, features = ["token", "associated_token"] }
# Transitive pins. Several of solana-program 1.18.x's recursive deps now have
# new releases that require Cargo's `edition2024` feature, which platform-tools
# cargo (1.75) and host cargo (1.77.2) cannot parse. We pin them to the last
# pre-edition2024 release that still satisfies the upstream version reqs.
blake3 = "=1.8.3"
proc-macro-crate = "=3.3.0"
toml_edit = "=0.22.27"
